services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: lab, POSTGRES_PASSWORD: lab, POSTGRES_DB: lab }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U lab"], interval: 2s, retries: 30 }
  api:
    build: ./backend
    environment: { DATABASE_URL: "postgres://lab:lab@db:5432/lab?sslmode=disable" }
    depends_on: { db: { condition: service_healthy } }
  web:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [api]
volumes:
  pgdata:
